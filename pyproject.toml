[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-bridge"
version = "0.4.0.dev0"
description = "Local-first seasonal anime bridge for Bangumi, Bahamut, Obsidian, and qBittorrent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "g36ck19941-crypto" }]
dependencies = []

[project.scripts]
anime-bridge = "anime_bridge.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
