[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anime-bridge"
version = "0.16.2.dev0"
description = "Local-first seasonal anime bridge for Bangumi, Bahamut, Obsidian, and qBittorrent"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "g36ck19941-crypto" }]
dependencies = ["opencc-python-reimplemented>=0.1.7,<0.2"]

[project.optional-dependencies]
mcp = ["mcp>=2,<3"]
build = ["mcp>=2,<3", "pyinstaller>=6.22,<7"]

[project.scripts]
anime-bridge = "anime_bridge.cli:main"
anime-bridge-mcp = "anime_bridge.mcp_server:main"
anime-bridge-gui = "anime_bridge.gui:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anime_bridge = ["web/*.html", "web/*.css", "web/*.js"]
